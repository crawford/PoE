source [find board/efm32.cfg]

# This config is known to work with the SLSTK3701a.
reset_config srst_open_drain connect_assert_srst

tpiu create efm32.cpu.tpiu -dap efm32.dap -ap-num 0x0
efm32.cpu.tpiu configure -protocol uart -traceclk 9500000 -output log.itm -formatter false

init

reset halt

rtt setup 0x20000000 16384 "SEGGER RTT"
rtt start
rtt server start 9090 0
rtt server start 9091 1
